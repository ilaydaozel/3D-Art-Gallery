<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Art Gallery</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: "Inter", system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
      }

      /* Start menu */
      #menuPanel {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 50% 35%,
          rgba(60, 50, 40, 0.55),
          rgba(10, 8, 6, 0.88)
        );
        backdrop-filter: blur(2px);
      }
      #menuCard {
        width: min(90vw, 420px);
        padding: 40px 36px 32px;
        border-radius: 16px;
        background: rgba(20, 17, 15, 0.72);
        border: 1px solid rgba(214, 191, 150, 0.35);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        text-align: center;
        color: #f3ead9;
      }
      #menuEyebrow {
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-size: 11px;
        color: #c9ad7c;
        margin-bottom: 10px;
      }
      #menuTitle {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 40px;
        margin: 0 0 12px;
        color: #fbf4e6;
      }
      #menuSubtitle {
        font-size: 14px;
        line-height: 1.6;
        color: #cfc3ad;
        margin: 0 0 28px;
      }
      #startButton {
        width: 100%;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #241d14;
        background: linear-gradient(180deg, #e9d6a8, #c9ad72);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      #startButton:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(201, 173, 114, 0.35);
      }
      #startButton:active {
        transform: translateY(0);
      }
      #startButton:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      #loadingBarTrack {
        margin-top: 16px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #loadingBarFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c9ad72, #e9d6a8);
        transition: width 0.2s ease;
      }
      #menuHint {
        margin-top: 22px;
        display: flex;
        justify-content: center;
        gap: 18px;
        font-size: 12px;
        color: #a89a80;
      }
      #menuHint span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 11px;
      }

      /* Artwork info card (shown while looking at a painting) */
      #infoPanel {
        position: absolute;
        left: 50%;
        bottom: 34px;
        transform: translate(-50%, 12px);
        width: min(86vw, 420px);
        padding: 16px 20px;
        border-radius: 10px;
        background: rgba(15, 13, 11, 0.78);
        border: 1px solid rgba(214, 191, 150, 0.3);
        color: #f3ead9;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }
      #infoPanel.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #infoTitle {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 22px;
        margin: 0 0 4px;
        color: #fbf4e6;
      }
      #infoMeta {
        font-size: 12px;
        letter-spacing: 0.03em;
        color: #c9ad7c;
        margin: 0 0 8px;
      }
      #infoDescription {
        font-size: 13px;
        line-height: 1.5;
        color: #cfc3ad;
        margin: 0;
      }

      #movementIconsMenu {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
      }
      .movement-icon {
        width: 50px;
        height: 50px;
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        border-radius: 10%;
        user-select: none;
        cursor: pointer;
      }
      .movement-icon:active {
        background-color: rgba(0, 0, 0, 0.7);
      }
      .horizontal {
        display: flex;
        justify-content: center;
        width: 100%;
        gap: 5px;
      }
    </style>
  </head>
  <body>
    <div id="menuPanel">
      <div id="menuCard">
        <h1 id="menuTitle">3D Art Gallery</h1>
        <p id="menuSubtitle">
          Walk through a virtual gallery of world-famous paintings. Look at a
          piece to read its title, artist and story.
        </p>
        <button id="startButton" disabled>Loading gallery…</button>
        <div id="loadingBarTrack"><div id="loadingBarFill"></div></div>
        <div id="menuHint">
          <span
            ><span class="key">W</span><span class="key">A</span
            ><span class="key">S</span><span class="key">D</span> move</span
          >
          <span>mouse look</span>
          <span><span class="key">Esc</span> exit</span>
        </div>
      </div>
    </div>
    <div id="infoPanel">
      <p id="infoTitle"></p>
      <p id="infoMeta"></p>
      <p id="infoDescription"></p>
    </div>
    <div id="movementIconsMenu">
      <div id="iconUp" class="movement-icon">↑</div>
      <div class="horizontal">
        <div id="iconLeft" class="movement-icon">←</div>
        <div id="iconDown" class="movement-icon">↓</div>
        <div id="iconRight" class="movement-icon">→</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
